<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Perfil</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.6);--line:rgba(255,255,255,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;width:min(92%,560px);margin:32px auto;padding:36px 28px;background:rgba(0,0,0,.72);border:1px solid var(--fg);backdrop-filter:blur(6px);animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{margin:0 0 6px;font-size:clamp(2rem,8vw,3rem);letter-spacing:-.03em;text-transform:uppercase;line-height:1}
.sub{color:var(--dim);margin:0 0 26px;font-size:.95rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{flex:1;min-width:110px;padding:12px 10px;background:transparent;color:var(--fg);border:1px solid var(--fg);font:inherit;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;transition:.25s}
.tab:hover{background:var(--line)}
.tab.on{background:var(--fg);color:var(--bg)}
.panel{display:none;min-height:130px;animation:fade .5s ease both}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.big{font-size:clamp(2.4rem,12vw,4rem);font-weight:700;margin:0;letter-spacing:-.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1px solid var(--fg);font-size:.9rem;transition:.25s;cursor:default}
.chip:hover{background:var(--fg);color:var(--bg);transform:translateY(-3px)}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.socials a{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;color:var(--bg);background:var(--fg);border:1px solid var(--fg);text-decoration:none;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.8rem;transition:.25s}
.socials a:hover{background:var(--bg);color:var(--fg);transform:translateY(-4px)}
.socials svg{width:18px;height:18px;fill:currentColor}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <h1 id="nome">Seu Nome</h1>
  <p class="sub">Escolha uma opção para me conhecer melhor</p>

  <div class="tabs">
    <button class="tab on" data-p="jogos">🎮 Jogos</button>
    <button class="tab" data-p="idade">🎂 Idade</button>
    <button class="tab" data-p="local">📍 Onde moro</button>
  </div>

  <section class="panel on" id="jogos"><div class="chips" id="chips"></div></section>
  <section class="panel" id="idade"><p class="big" id="idadeTxt"></p></section>
  <section class="panel" id="local"><p class="big" id="localTxt"></p></section>

  <div class="socials">
    <a href="https://github.com/meiodia" id="github" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.61 5.24-5.1 5.51.4.35.75 1.02.75 2.06v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>GitHub</a>
    <a href="#" id="ig" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5ZM17.3 6a1 1 0 1 1-1 1 1 1 0 0 1 1-1Z"/></svg>Instagram</a>
    <a href="#" id="tt" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.2a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.4a5.8 5.8 0 1 0 5 5.7V8.6a7.200 7.200 0 0 0 4.200 1.400V6.800A4.200 4.200 0 0 1 16.600 2Z"/></svg>TikTok</a>
    <a href="#" id="yt" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21.600 7.200a2.500 2.500 0 0 0-1.800-1.800C18.200 5 12 5 12 5s-6.200 0-7.800.4A2.500 2.500 0 0 0 2.400 7.200C2 8.800 2 12 2 12s0 3.200.4 4.800a2.500 2.500 0 0 0 1.800 1.800C5.800 19 12 19 12 19s6.200 0 7.800-.4a2.500 2.500 0 0 0 1.800-1.800c.4-1.600.4-4.800.4-4.800s0-3.200-.4-4.800ZM10 15V9l5.200 3Z"/></svg>YouTube</a>
  </div>
</main>

<script>
// ✏️ EDITE AQUI COM SEUS DADOS
const perfil = {
  nome: "meiodia",
  idade: "21 anos",
  local: "São Paulo, SP",
  jogos: ["💻 Jogo no PC", "Valorant", "CS", "Minecraft", "Elden Ring", "Todos os Soulslike", "E vários outros"],
  github: "https://github.com/meiodia",
  instagram: "https://instagram.com/Daviikkjj7",
  tiktok: "https://tiktok.com/@meiodiaaaa",
  youtube: ""
};

document.getElementById("github").href = perfil.github;
document.getElementById("nome").textContent = perfil.nome;
document.getElementById("idadeTxt").textContent = perfil.idade;
document.getElementById("localTxt").textContent = perfil.local;
document.getElementById("chips").innerHTML = perfil.jogos.map(j => '<span class="chip"></span>').join("");
document.querySelectorAll(".chip").forEach((el, i) => el.textContent = perfil.jogos[i]);
document.getElementById("ig").href = perfil.instagram;
document.getElementById("tt").href = perfil.tiktok;
if (perfil.youtube) document.getElementById("yt").href = perfil.youtube; else document.getElementById("yt").remove();

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab,.panel").forEach(e => e.classList.remove("on"));
  b.classList.add("on");
  document.getElementById(b.dataset.p).classList.add("on");
});

// Linhas animadas
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, t = 0;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize", size); size();
function draw(){
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);
  const n = 28, gap = H/n;
  for(let i = 0; i < n; i++){
    ctx.beginPath();
    ctx.strokeStyle = "rgba(255,255,255," + (0.15 + 0.35*((i%4)/3)) + ")";
    ctx.lineWidth = i%7===0 ? 2 : 1;
    for(let x = 0; x <= W; x += 8){
      const y = gap*i + Math.sin(x*0.006 + t + i*0.35)*18 + Math.sin(x*0.013 - t*1.3 + i)*8;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // linhas verticais deslizando
  for(let k = 0; k < 10; k++){
    const x = ((k*W/10) + t*60) % W;
    ctx.fillStyle = "rgba(255,255,255,.07)";
    ctx.fillRect(x, 0, 1, H);
  }
  t += 0.012;
  if(!still) requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
